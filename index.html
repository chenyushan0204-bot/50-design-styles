<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yushan · 飞书 CLI 画板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;background:#F5F5F5;color:#1A1A1A}
.header{background:#FFF;border-bottom:1px solid #E8E8E8;padding:20px 24px 0;position:sticky;top:0;z-index:10}
h1{font-size:26px;font-weight:900}
.tabs{display:flex;gap:0;margin-top:16px}
.tab{padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;border:none;background:none;color:#888;border-bottom:3px solid transparent;transition:all .15s}
.tab:hover{color:#333}
.tab.active{color:#1A1A1A;border-bottom-color:#4361EE}
.tab .count{font-size:11px;color:#AAA;font-weight:400}
.tab.active .count{color:#4361EE}
.content{padding:24px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;max-width:2000px;margin:0 auto}
.grid-examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(540px,1fr));gap:20px;max-width:1800px;margin:0 auto}
.card{background:#FFF;border-radius:12px;overflow:hidden;border:1px solid #E8E8E8;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08)}
.card-inner{padding:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.num{font-size:11px;font-weight:800;color:#CCC}
.type-tag{font-size:10px;font-weight:700;color:#999;background:#F0F0F0;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
.name-cn{font-size:18px;font-weight:900;line-height:1.3;margin-bottom:2px}
.name-en{font-size:12px;color:#AAA;margin-bottom:8px}
.keywords{font-size:11px;color:#666;line-height:1.5;margin-bottom:4px}
.best{font-size:11px;color:#888;line-height:1.5;margin-bottom:8px}
.swatches{display:flex;gap:6px;margin-bottom:10px}
.swatch{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.08)}
.preview{width:100%;height:auto;border-radius:6px;border:1px solid #EEE;display:block}
.example-card{background:#FFF;border-radius:12px;overflow:hidden;border:1px solid #E8E8E8}
.example-header{padding:20px 20px 12px;display:flex;align-items:flex-start;gap:16px}
.example-num{font-size:48px;font-weight:900;color:#EEE;line-height:1;min-width:50px}
.example-title{padding-top:8px;flex:1}
.example-cn{font-size:20px;font-weight:900}
.example-en{font-size:13px;color:#AAA}
.example-scene{font-size:12px;color:#666;margin-top:6px}
.example-scene span{background:#EEF2FF;color:#4361EE;padding:2px 8px;border-radius:4px;font-weight:600}
.example-img{width:100%;display:block;border-top:1px solid #EEE}
.example-prompt{background:#F8F9FB;border-top:1px solid #EEE;padding:14px 20px;font-size:12px;color:#555;line-height:1.6;font-family:"SF Mono",Menlo,monospace;white-space:pre-wrap;max-height:130px;overflow-y:auto}
.example-prompt::before{content:" 提示词 / Prompt";display:block;font-size:10px;font-weight:700;color:#AAA;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;font-family:-apple-system,sans-serif}
</style>
</head>

function renderStyles(){
  let h='';
  S.forEach((s,i)=>{
    h+=`<div class="card"><div class="card-inner">
      <div class="card-header"><span class="num">#${i+1}</span><span class="type-tag">${s.tp}</span></div>
      <div class="name-cn">${s.cn}</div><div class="name-en">${s.en}</div>
      <div class="keywords"> ${s.kw}</div><div class="best"> ${s.best}</div>
      <div class="swatches">${s.sw.map(c=>`<span class="swatch" style="background:${c}"></span>`).join('')}</div>
      <img class="preview" src="pngs/${s.fn}.png" alt="${s.cn}" loading="lazy" onerror="this.style.display='none'" />
    </div></div>`;
  });
  document.getElementById('styles-grid').innerHTML=h;
}

function renderExamples(){
  let h='';
  E.forEach(e=>{
    h+=`<div class="example-card">
      <div class="example-header">
        <div class="example-num">${e.n}</div>
        <div class="example-title"><div class="example-cn">${e.cn}</div><div class="example-en">${e.en}</div>
        <div class="example-scene"><span>${e.scene}</span></div></div>
      </div>
      <img class="example-img" src="examples/images/examples-${e.id}.png" alt="${e.cn}" loading="lazy" />
      <div class="example-prompt">${e.prompt}</div>
    </div>`;
  });
  document.getElementById('examples-grid').innerHTML=h;
}

function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

renderStyles();renderExamples();
